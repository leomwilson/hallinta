<div class="task-container">
  <h2 class="task-title">{{ task?.title || 'Untitled task' }}</h2>
  <p class="task-description">{{ task?.description || 'No description' }}</p>
  <p class="task-due-date">Due: {{ task?.dueDate || 'No due date' }}</p>
  <p class="task-priority">Priority: {{ task?.priority || 'Normal' }}</p>
  <p class="task-status">Status: {{ task?.status || 'Pending' }}</p>
</div>
