<app-nav-bar></app-nav-bar>

<main class="container">
	<section class="tasks">
		<p>Tasks: {{ tasks().length }}</p>
		<button (click)="addSampleTask()">Add task</button>

		<div *ngIf="tasks().length === 0">
			<p>No tasks yet.</p>
		</div>

			<div class="task-list">
				<app-task *ngFor="let t of sortedTasks(); let i = index" [task]="t" (taskChange)="onTaskChangeByCreatedAt(t.createdAt ?? 0, $event)"></app-task>
			</div>
	</section>
</main>
